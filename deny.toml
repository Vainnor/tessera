# cargo-deny: https://embarkstudios.github.io/cargo-deny/
# Policy: docs/architecture.md § Dependencies and .claude/rules/dependencies.md.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Each ignore carries an id, a reason and a revisit date. Unmaintained-but-not-vulnerable
# crates on Tauri's Linux path are the expected entries here.
ignore = [
  # Unmaintained, not vulnerable: a build-time proc macro reached only through gtk-rs 0.18 on
  # Tauri's Linux webview path. Revisit 2027-01-31 or when Tauri moves off gtk-rs 0.18.
  # cargo audit also prints RUSTSEC-2024-0429 (glib VariantStrIter unsoundness) on the same
  # path as a warning; Tessera never calls that API.
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: build-time macro via gtk 0.18 (Tauri Linux)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
# Permissive licenses and MPL-2.0 (file-level copyleft) are compatible with distributing
# Tessera under AGPL-3.0-or-later. Anything else needs a decision recorded in docs/adr/.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
]

[licenses.private]
# Our own crates are AGPL-3.0-or-later and unpublished.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
