name: Feature request
description: Suggest something Tessera should do.
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Tessera makes hard today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: markdown
    attributes:
      value: |
        Use made-up examples only: no note content, real file paths or usernames.
  - type: checkboxes
    id: principles
    attributes:
      label: Project principles
      options:
        - label: This works without telemetry, accounts or third-party services.
          required: true
