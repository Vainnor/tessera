name: Bug report
description: Something does not work as it should.
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems go through private reporting (Security tab), not here.
        Do not paste note content, file paths from your home folder, or anything private.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tessera version or commit
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Windows, Linux, Website, Sync server]
    validations:
      required: true
