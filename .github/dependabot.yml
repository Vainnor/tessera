version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    # Let a release age a week before proposing it; most compromised releases are pulled sooner.
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      tauri:
        patterns: ["tauri*"]
      tokio-axum:
        patterns: ["tokio*", "axum*", "tower*", "hyper*"]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      react:
        patterns: ["react", "react-dom", "@types/react*"]
      astro:
        patterns: ["astro", "@astrojs/*", "prettier-plugin-astro"]
      lint:
        patterns: ["eslint*", "@eslint/*", "typescript-eslint", "prettier", "globals"]
  - package-ecosystem: docker
    directories: ["/apps/web", "/crates/server"]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    labels: [dependencies]
    ignore:
      # The image builds with the Node major CI uses (NODE_VERSION in ci.yml); move both together.
      # Node 26 also drops corepack, which the web Dockerfile uses to install pnpm.
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    labels: [dependencies]
