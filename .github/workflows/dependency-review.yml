name: Dependency review

on:
  pull_request:

permissions: {}

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Blocks a pull request that adds a dependency with a known high-severity advisory or a
      # license outside the allowlist (the same set as deny.toml, plus data licenses npm uses).
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
          allow-licenses: >-
            MIT, MIT-0, Apache-2.0, Apache-2.0 WITH LLVM-exception, BSD-2-Clause, BSD-3-Clause,
            ISC, Zlib, Unicode-3.0, CC0-1.0, MPL-2.0, CDLA-Permissive-2.0, BSL-1.0, 0BSD,
            BlueOak-1.0.0, CC-BY-4.0, Python-2.0
