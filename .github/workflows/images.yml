name: Images

# Container images, pushed to ghcr.io/vainnor/tessera-<name>.
#
# - Pull requests build every image and push nothing.
# - When CI passes on main, every image is pushed as <version>-<short sha> and `main`, and the
#   website's image is promoted to `prod`, and the homelab is told to deploy that build.
# - A `v<version>` tag pushes <version> and `latest`. It does not deploy.
#
# <version> is [workspace.package] version in Cargo.toml. Waiting for CI keeps a red main out of
# production; it also means a deploy follows the slowest CI job.
on:
  # Only acts on CI runs for pushes to main in this repository; the version job checks that.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/images.yml"
      - ".dockerignore"
      - "apps/web/**"
      - "packages/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

# Nothing by default; each job asks for what it needs.
permissions: {}

# Runs for main queue rather than cancel, so a deploy is never cut off halfway. The deploy job
# checks it is still building the tip of main, so a queued older run cannot roll prod back.
concurrency:
  group: images-${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/vainnor

jobs:
  version:
    name: Version
    # A workflow_run only counts when CI succeeded on a push to main in this repository. The
    # branch filter alone would also match a fork's branch named main.
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.v.outputs.sha }}
      version: ${{ steps.v.outputs.version }}
      push: ${{ steps.v.outputs.push }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          sha="$(git rev-parse HEAD)"
          base="$(awk '/^\[workspace\.package\]/ { s = 1; next } /^\[/ { s = 0 }
            s && /^version *=/ { gsub(/[" ]/, "", $0); sub(/^version=/, "", $0); print; exit }' Cargo.toml)"
          if [ -z "$base" ]; then
            echo "::error::no [workspace.package] version in Cargo.toml"
            exit 1
          fi
          push=true
          release=false
          if [ "$REF_TYPE" = tag ]; then
            if [ "$REF_NAME" != "v$base" ]; then
              echo "::error::tag $REF_NAME does not match Cargo.toml version $base"
              exit 1
            fi
            version="$base"
            release=true
          else
            version="$base-${sha:0:7}"
            [ "$EVENT" = pull_request ] && push=false
          fi
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "push=$push"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"
          echo "### $version" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.image }}
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            dockerfile: apps/web/Dockerfile
            title: Tessera website
            # The build stage runs natively, so arm64 costs nothing.
            platforms: linux/amd64,linux/arm64
          - image: server
            dockerfile: crates/server/Dockerfile
            title: Tessera sync server
            # arm64 would compile Rust under QEMU; add it with cross-compilation when needed.
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: needs.version.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/tessera-${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=main,enable=${{ github.event_name == 'workflow_run' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.release == 'true' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ needs.version.outputs.sha }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ needs.version.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy-web:
    name: Deploy website
    needs: [version, build]
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://tessera.vainnor.com
    permissions:
      contents: read
      packages: write
    steps:
      - name: Skip if main has moved on
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          tip="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          if [ "$tip" = "$SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main is now at $tip; leaving prod for that run"
          fi
      - if: steps.tip.outputs.current == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.tip.outputs.current == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Retags the image that was just built and tested; nothing is rebuilt.
      - name: Promote to prod
        if: steps.tip.outputs.current == 'true'
        env:
          IMAGE: ${{ env.REGISTRY }}/tessera-web
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:prod" "$IMAGE:$VERSION"
          echo "Promoted $IMAGE:$VERSION to prod" >> "$GITHUB_STEP_SUMMARY"
      # Tells the homelab which build to deploy. Vainnor/homelab-infra's tessera-deploy.yml takes
      # only the tag and the commit from this, resolves the tag to a digest in GHCR itself, and
      # commits the pin; Argo CD rolls it out. The tag sent is the immutable <version>-<sha7>, not
      # `prod`, so the homelab's git history names the build it runs.
      #
      # HOMELAB_DEPLOY_TOKEN is a fine-grained token for Vainnor/homelab-infra only, with Contents
      # read and write: the narrowest permission that can send a repository_dispatch.
      - name: Tell the homelab to deploy
        if: steps.tip.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMELAB_DEPLOY_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          set -euo pipefail
          # An unset secret expands to an empty string, and gh then fails with an error that
          # points at authentication rather than at the missing secret.
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::HOMELAB_DEPLOY_TOKEN is not set, so the homelab was not told to deploy. prod was promoted; only the deploy trigger was skipped."
            exit 1
          fi
          gh api --method POST repos/Vainnor/homelab-infra/dispatches \
            -f event_type=tessera-web-image \
            -F "client_payload[tag]=$VERSION" \
            -F "client_payload[sha]=$SHA"
          echo "Dispatched tessera-web-image -> $VERSION" >> "$GITHUB_STEP_SUMMARY"
